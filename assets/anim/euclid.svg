<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Animated diagram: three nearby objects in a field; in the 0-degree grism direction the spectrum of the object of interest overlaps with object 2, in the 90-degree direction with object 3; the spectrum is then separated"><style>
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:600}50%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:600}}
.dispx{transform-box:fill-box;transform-origin:left center;animation:dispx 5s ease-in-out infinite}
@keyframes dispx{0%,8%{transform:scaleX(.12)}40%,85%{transform:scaleX(1)}100%{transform:scaleX(.12)}}
.dispy{animation:none}
@keyframes dispy{0%,8%{transform:scaleY(.12)}40%,85%{transform:scaleY(1)}100%{transform:scaleY(.12)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.draw{stroke-dashoffset:0}}
</style>
<rect width="400" height="250" fill="#07080C"/>
<text x="12" y="20" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">field</text>
<rect x="12" y="30" width="110" height="110" fill="#111319" stroke="#2C2C2C"/>
<circle cx="48" cy="70" r="9" fill="#D9D9D9"/><text x="48" y="74" fill="#07080C" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">1</text>
<circle cx="86" cy="80" r="7" fill="#7A7A7A"/><text x="86" y="84" fill="#07080C" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">2</text>
<circle cx="54" cy="112" r="8" fill="#A8A8A8"/><text x="54" y="116" fill="#07080C" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">3</text>
<circle cx="104" cy="46" r="2" fill="#5A5A5A"/><circle cx="26" cy="128" r="2" fill="#5A5A5A"/>
<text x="12" y="164" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">1 = object of</text>
<text x="12" y="178" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">interest</text>
<text x="12" y="200" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">dashed = mixed</text>
<text x="140" y="20" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">grism 0°</text>
<rect x="140" y="30" width="120" height="78" fill="#111319" stroke="#2C2C2C"/>
<rect class="dispx" x="150" y="44" width="70" height="16" rx="8" fill="#D9D9D9" opacity=".9"/>
<rect class="dispx" x="178" y="54" width="70" height="14" rx="7" fill="#7A7A7A" opacity=".9"/>
<rect class="dispx" x="154" y="82" width="70" height="14" rx="7" fill="#A8A8A8" opacity=".9"/>
<rect x="148" y="41" width="74" height="22" fill="none" stroke="#D7263D" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="140" y="130" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">grism 90°</text>
<rect x="140" y="140" width="120" height="96" fill="#111319" stroke="#2C2C2C"/>
<rect class="dispy" x="160" y="150" width="16" height="70" rx="8" fill="#D9D9D9" opacity=".9"/>
<rect class="dispy" x="168" y="176" width="14" height="56" rx="7" fill="#A8A8A8" opacity=".9"/>
<rect class="dispy" x="214" y="150" width="14" height="70" rx="7" fill="#7A7A7A" opacity=".9"/>
<rect x="157" y="147" width="22" height="76" fill="none" stroke="#D7263D" stroke-width="1.2" stroke-dasharray="3 2"/>
<path d="M264 128 L280 128 M275 123 L280 128 L275 133" stroke="#D9D9D9" stroke-width="2" fill="none"/>
<text x="288" y="20" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">fuse + separate</text>
<rect x="288" y="30" width="100" height="40" fill="none" stroke="#0F7A5A" stroke-width="1.5"/>
<text x="338" y="48" fill="#D9D9D9" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">least squares</text>
<text x="338" y="62" fill="#D9D9D9" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">/ NMF</text>
<path class="draw" d="M288 150 C300 150 304 136 312 136 C320 136 324 150 336 150 C350 150 354 118 362 118 C370 118 376 148 388 148" fill="none" stroke="#D9A21B" stroke-width="2.5"/>
<text x="288" y="172" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">clean spectrum of 1</text>
<text x="288" y="186" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">→ redshift</text>
<text x="388" y="240" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="end">ESA Euclid · IRAP · CNES</text>
</svg>