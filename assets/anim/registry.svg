<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Animated pipeline: data flows from PACS through DICOM and NIfTI conversion to linkage with lab results and feature extraction"><style>
.flowL{animation:flowL 4s linear infinite}
@keyframes flowL{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(276px);opacity:0}}
.flowD{animation:flowD 2s linear infinite}
@keyframes flowD{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
.d1{animation-delay:.8s}
.d2{animation-delay:1.6s}
.d3{animation-delay:2.4s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.draw{stroke-dashoffset:0}}
</style>
<rect width="400" height="250" fill="#0E0E0E"/>
<line x1="62" y1="140" x2="338" y2="140" stroke="#3A3A3A" stroke-width="2"/>
<circle cx="40" cy="140" r="22" fill="#1C1C1C" stroke="#9A9A9A" stroke-width="2"/>
<circle cx="120" cy="140" r="22" fill="#1C1C1C" stroke="#9A9A9A" stroke-width="2"/>
<circle cx="200" cy="140" r="22" fill="#1C1C1C" stroke="#9A9A9A" stroke-width="2"/>
<circle cx="280" cy="140" r="22" fill="#1C1C1C" stroke="#D9A21B" stroke-width="2"/>
<circle cx="360" cy="140" r="22" fill="#1C1C1C" stroke="#0F7A5A" stroke-width="2"/>
<circle class="flowL" cx="62" cy="140" r="4" fill="#0F7A5A"/>
<circle class="flowL d1" cx="62" cy="140" r="4" fill="#0F7A5A"/>
<circle class="flowL d2" cx="62" cy="140" r="4" fill="#0F7A5A"/>
<circle class="flowL d3" cx="62" cy="140" r="4" fill="#0F7A5A"/>
<line x1="280" y1="80" x2="280" y2="118" stroke="#3A3A3A" stroke-width="2"/>
<circle class="flowD" cx="280" cy="82" r="3.5" fill="#D9A21B"/>
<circle class="flowD d1" cx="280" cy="82" r="3.5" fill="#D9A21B"/>
<text x="280" y="68" fill="#D9A21B" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">+1M lab results</text>
<text x="40" y="186" fill="#D9D9D9" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">PACS</text>
<text x="120" y="186" fill="#D9D9D9" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">DICOM</text>
<text x="200" y="186" fill="#D9D9D9" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">NIfTI</text>
<text x="280" y="186" fill="#D9D9D9" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">linkage</text>
<text x="360" y="186" fill="#D9D9D9" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">features</text>
<text x="12" y="20" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">Brest Stroke Registry · 14k+ patients</text>
</svg>