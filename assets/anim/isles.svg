<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Animated summary of the ISLES'26 method: training centers are assigned to three folds and a holdout by mixed-integer linear programming, MRI intensities are clipped at percentiles before z-scoring, and three nnU-Net fold models are ensembled with test-time augmentation to segment the stroke lesion">
<style>
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop 6s ease-in-out infinite}
@keyframes pop{0%,8%{opacity:0;transform:scale(.2)}18%,88%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.a1{animation-delay:.1s}.a2{animation-delay:.35s}.a3{animation-delay:.6s}.a4{animation-delay:.85s}.a5{animation-delay:1.1s}.a6{animation-delay:1.35s}.a7{animation-delay:1.6s}.a8{animation-delay:1.85s}
.clip{opacity:0;animation:clip 6s ease-in-out infinite;animation-delay:1.2s}
@keyframes clip{0%,20%{opacity:0}35%,90%{opacity:.6}100%{opacity:0}}
.flow{animation:flow 2s linear infinite}
@keyframes flow{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.lesion{opacity:0;animation:lesion 6s ease-in-out infinite;animation-delay:2.4s}
@keyframes lesion{0%,30%{opacity:0}45%,90%{opacity:.85}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.pop{opacity:1}.clip{opacity:.6}.lesion{opacity:.85}}
text{font-family:ui-monospace,Menlo,Consolas,monospace}
</style>
<rect width="400" height="250" fill="#0E0E0E"/>
<text x="12" y="20" fill="#9A9A9A" font-size="11">ISLES’26 · T1w MRI</text>
<text x="388" y="20" fill="#D9A21B" font-size="11" text-anchor="end">Dice 0.712 · F1 0.500</text>
<line x1="134" y1="34" x2="134" y2="226" stroke="#2C2C2C"/>
<line x1="264" y1="34" x2="264" y2="226" stroke="#2C2C2C"/>

<text x="12" y="44" fill="#D9D9D9" font-size="9.5">1 · center split</text>
<g fill="none" stroke="#3A3A3A"><rect x="14" y="54" width="110" height="30" rx="3"/><rect x="14" y="90" width="110" height="30" rx="3"/><rect x="14" y="126" width="110" height="30" rx="3"/><rect x="14" y="162" width="110" height="30" rx="3" stroke-dasharray="3 3"/></g>
<g fill="#8A8A8A" font-size="9"><text x="20" y="73">fold 1</text><text x="20" y="109">fold 2</text><text x="20" y="145">fold 3</text><text x="20" y="181">holdout</text></g>
<rect class="pop a1" x="66" y="63" width="12" height="12" rx="2" fill="#0F7A5A"/>
<rect class="pop a2" x="84" y="63" width="12" height="12" rx="2" fill="#B5542A"/>
<rect class="pop a3" x="66" y="99" width="12" height="12" rx="2" fill="#4C6FD1"/>
<rect class="pop a4" x="84" y="99" width="12" height="12" rx="2" fill="#D9A21B"/>
<rect class="pop a5" x="102" y="99" width="12" height="12" rx="2" fill="#8C4A6B"/>
<rect class="pop a6" x="66" y="135" width="12" height="12" rx="2" fill="#2E8C8C"/>
<rect class="pop a7" x="84" y="135" width="12" height="12" rx="2" fill="#C9CFDF"/>
<rect class="pop a8" x="66" y="171" width="12" height="12" rx="2" fill="#6F6F6F"/>
<text x="12" y="210" fill="#9A9A9A" font-size="9">MILP balances lesion</text>
<text x="12" y="222" fill="#9A9A9A" font-size="9">profiles per center</text>

<text x="142" y="44" fill="#D9D9D9" font-size="9.5">2 · normalize</text>
<g fill="#6F6F6F">
<rect x="148" y="160" width="6" height="12"/><rect x="156" y="140" width="6" height="32"/><rect x="164" y="118" width="6" height="54"/><rect x="172" y="96" width="6" height="76"/><rect x="180" y="84" width="6" height="88"/><rect x="188" y="92" width="6" height="80"/><rect x="196" y="108" width="6" height="64"/><rect x="204" y="126" width="6" height="46"/><rect x="212" y="142" width="6" height="30"/><rect x="220" y="154" width="6" height="18"/><rect x="228" y="162" width="6" height="10"/><rect x="246" y="150" width="6" height="22" fill="#9A9A9A"/>
</g>
<line x1="144" y1="172" x2="258" y2="172" stroke="#3A3A3A"/>
<rect class="clip" x="240" y="60" width="18" height="112" fill="#B5542A"/>
<rect class="clip" x="140" y="60" width="6" height="112" fill="#B5542A"/>
<line x1="146" y1="60" x2="146" y2="172" stroke="#D9A21B" stroke-dasharray="3 3"/>
<line x1="240" y1="60" x2="240" y2="172" stroke="#D9A21B" stroke-dasharray="3 3"/>
<text x="142" y="190" fill="#9A9A9A" font-size="9">clip at p0.5 / p99.5,</text>
<text x="142" y="202" fill="#9A9A9A" font-size="9">then z-score in the brain:</text>
<text x="142" y="214" fill="#9A9A9A" font-size="9">keeps faint acute lesions</text>

<text x="272" y="44" fill="#D9D9D9" font-size="9.5">3 · ensemble</text>
<g fill="none" stroke="#0F7A5A" stroke-width="1.5"><rect x="272" y="54" width="62" height="20" rx="3"/><rect x="272" y="80" width="62" height="20" rx="3"/><rect x="272" y="106" width="62" height="20" rx="3"/></g>
<g fill="#D9D9D9" font-size="8.5"><text x="303" y="67" text-anchor="middle">nnU-Net 1</text><text x="303" y="93" text-anchor="middle">nnU-Net 2</text><text x="303" y="119" text-anchor="middle">nnU-Net 3</text></g>
<text x="272" y="140" fill="#8A8A8A" font-size="8">ResEnc-L + TTA</text>
<path d="M334 64 C372 64 372 120 362 152 M334 90 C366 90 368 120 362 152 M334 116 C360 116 366 130 362 152" fill="none" stroke="#3A3A3A"/>
<circle class="flow" cx="334" cy="64" r="3" fill="#D9A21B" style="--dx:28px;--dy:88px"/>
<circle class="flow" cx="334" cy="116" r="3" fill="#D9A21B" style="--dx:28px;--dy:36px;animation-delay:.7s"/>
<ellipse cx="350" cy="192" rx="32" ry="36" fill="#2C2C2C"/>
<ellipse cx="350" cy="192" rx="26" ry="30" fill="#454545"/>
<path d="M350 164 L350 220" stroke="#2C2C2C" stroke-width="2"/>
<path class="lesion" d="M332 180 C326 190 330 203 339 205 C348 207 351 196 348 187 C345 179 338 175 332 180Z" fill="#B5542A"/>
</svg>
