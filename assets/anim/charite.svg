<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Animated pair of CT slices: baseline and follow-up, the hematoma grows between them, with the model trained in Berlin applied in Brest"><style>
.grow{transform-box:fill-box;transform-origin:center;animation:grow 3.5s ease-in-out infinite}
@keyframes grow{0%,15%{transform:scale(1)}55%,85%{transform:scale(1.6)}100%{transform:scale(1)}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.draw{stroke-dashoffset:0}}
</style>
<rect width="400" height="250" fill="#0E0E0E"/>
<circle cx="110" cy="130" r="70" fill="#3A3A3A" stroke="#D9D9D9" stroke-width="5"/>
<ellipse cx="92" cy="116" rx="14" ry="11" fill="#E5E5E5"/>
<circle cx="290" cy="130" r="70" fill="#3A3A3A" stroke="#D9D9D9" stroke-width="5"/>
<ellipse class="grow" cx="272" cy="116" rx="14" ry="11" fill="#E5E5E5"/>
<ellipse class="pulse" cx="272" cy="116" rx="24" ry="19" fill="none" stroke="#D9A21B" stroke-width="2" stroke-dasharray="4 3"/>
<path d="M186 130 L210 130 M204 124 L210 130 L204 136" stroke="#9A9A9A" stroke-width="2" fill="none"/>
<text x="110" y="226" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">baseline CT</text>
<text x="290" y="226" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">follow-up CT</text>
<text x="12" y="20" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">trained in Berlin</text>
<text x="388" y="20" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="end">tested in Brest · 271 pairs</text>
</svg>