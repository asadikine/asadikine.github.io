<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Animated diagram: CT features and admission data enter a model that outputs a 30-day mortality probability, placed on a low, moderate, high risk scale"><style>
.flowS{animation:flowS 2.4s linear infinite}
@keyframes flowS{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(68px);opacity:0}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.gauge{transform-box:fill-box;transform-origin:center;animation:gauge 6s ease-in-out infinite}
@keyframes gauge{0%,10%{transform:rotate(180deg) translateX(0)}35%,50%{transform:rotate(180deg) translateX(-40px)}75%,90%{transform:rotate(180deg) translateX(-80px)}100%{transform:rotate(180deg) translateX(0)}}
.d1{animation-delay:.8s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.draw{stroke-dashoffset:0}}
</style>
<rect width="400" height="250" fill="#0E0E0E"/>
<circle cx="62" cy="86" r="44" fill="#3A3A3A" stroke="#D9D9D9" stroke-width="5"/>
<ellipse cx="50" cy="76" rx="15" ry="11" fill="#E5E5E5"/>
<ellipse class="pulse" cx="50" cy="76" rx="20" ry="16" fill="none" stroke="#B5542A" stroke-width="2" stroke-dasharray="4 3"/>
<text x="18" y="160" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10">age</text>
<rect x="52" y="152" width="48" height="8" fill="#6F6F6F"/>
<text x="18" y="180" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10">GCS</text>
<rect x="52" y="172" width="32" height="8" fill="#6F6F6F"/>
<text x="18" y="200" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10">BP</text>
<rect x="52" y="192" width="56" height="8" fill="#6F6F6F"/>
<circle class="flowS" cx="118" cy="96" r="4" fill="#B5542A"/>
<circle class="flowS d1" cx="118" cy="176" r="4" fill="#D9A21B"/>
<path d="M120 96 C150 96 160 112 186 118 M120 176 C150 176 160 136 186 128" stroke="#3A3A3A" fill="none"/>
<rect x="188" y="100" width="58" height="46" rx="4" fill="none" stroke="#0F7A5A" stroke-width="2"/>
<text x="217" y="127" fill="#D9D9D9" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">model</text>
<path d="M248 123 L270 123 M264 117 L270 123 L264 129" stroke="#D9D9D9" stroke-width="2" fill="none"/>
<text x="326" y="84" fill="#D9D9D9" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">p(death, 30 d)</text>
<rect x="268" y="112" width="40" height="12" rx="6" fill="#3F8F5A"/>
<rect x="308" y="112" width="40" height="12" fill="#D1A43C"/>
<rect x="348" y="112" width="40" height="12" rx="6" fill="#B5362D"/>
<path class="gauge" d="M282 104 L288 96 L294 104Z" fill="#F6F1E7"/>
<text x="288" y="140" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">low</text>
<text x="328" y="140" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">mod.</text>
<text x="368" y="140" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">high</text>
<text x="12" y="20" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">NCCT + admission data</text>
<text x="388" y="20" fill="#9A9A9A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="end">risk stratification</text>
</svg>